# cargo-deny configuration for downloader-rs
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Exclude dev-dependencies from checks (they're not shipped)
exclude-dev = true

[advisories]
# The database of security advisories
db-path = "~/.cargo/advisory-db"
# URL for fetching the advisory database
url = "https://github.com/rustsec/advisory-db"
# Fail if the advisory database hasn't been updated in this many days
max-stale = 7

# How to handle advisories that are unmaintained/unsound
unmaintained = "warn"
yanked = "deny"

# Ignore specific advisories (with justification)
ignore = [
    # Example: "RUSTSEC-2020-0001",  # Reason for ignoring
]

[licenses]
# Confidence threshold for license detection
confidence-threshold = 0.8

# List of allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]

# Deny copyleft licenses
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
]

# Clarify license for specific crates
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[bans]
# How to handle multiple versions of the same crate
multiple-versions = "warn"
# How to handle wildcard dependencies
wildcards = "deny"
# Allow specific duplicates
allow-build-scripts = ["*"]

# Highlight particularly important crates
highlight = "all"

# Deny specific crates
deny = [
    # Example: { name = "openssl", wrappers = ["openssl-sys"] },
]

# Skip checking certain crates for duplicates
skip = [
    # Example: { name = "rand", version = "0.7" },
]

# Tree-skip: skip entire dependency trees
skip-tree = [
    # Example: { name = "windows-sys" },
]

[sources]
# Crates must come from these sources
unknown-registry = "deny"
unknown-git = "deny"

# Allow crates from crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Allow git dependencies only from specific orgs (if any)
# allow-git = []

[sources.allow-org]
# Allow crates from specific GitHub organizations
github = []
